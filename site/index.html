<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Chester Games</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="catalog">
      <header class="hero">
        <p class="eyebrow">CHESTER GAMES</p>
        <h1>Игры, которые хочется<br />осваивать</h1>
        <p class="hero__text">Небольшая коллекция игр. Начинаем с планетарной стратегии.</p>
      </header>

      <section aria-labelledby="games-title">
        <div class="section-heading">
          <h2 id="games-title">Игры</h2>
          <span>1 игра</span>
        </div>

        <a class="game-card" href="/planet/" aria-label="Открыть Planet Flow">
          <div class="game-card__orbit orbit orbit--one"></div>
          <div class="game-card__orbit orbit orbit--two"></div>
          <div class="planet planet--blue"><span>3</span></div>
          <div class="planet planet--orange"><span>7</span></div>
          <div class="game-card__content">
            <span class="game-card__label">СТРАТЕГИЯ</span>
            <h3>Planet Flow</h3>
            <p>Захватывай планеты, направляй энергию и побеждай соперников.</p>
            <span class="play-button">Играть <b>→</b></span>
          </div>
        </a>
      </section>
    </main>
  </body>
</html>
