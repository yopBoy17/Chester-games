<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chester Games</title>
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <main class="hub">
    <header class="hub-header">
      <p class="eyebrow">Chester Games</p>
      <h1>Игры</h1>
      <p>Небольшая коллекция игр, которые мы создаём и развиваем.</p>
    </header>

    <section class="games" aria-label="Список игр">
      <a class="game-card" href="/planet/">
        <span class="game-icon">◌</span>
        <span class="game-copy">
          <strong>Planet Flow</strong>
          <small>Стратегия о потоках энергии и захвате планет</small>
        </span>
        <span class="arrow">→</span>
      </a>
      <a class="game-card" href="/factory/">
        <span class="game-icon game-icon--factory">⚙</span>
        <span class="game-copy">
          <strong>Factory</strong>
          <small>Строй фабрику, добывай ресурсы и развивай производство</small>
        </span>
        <span class="arrow">→</span>
      </a>
    </section>
  </main>
</body>
</html>
