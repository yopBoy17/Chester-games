<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factory</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="factory-app">
      <header class="toolbar" aria-label="Панель ресурсов">
        <div class="resource-group resource-group--energy">
          <div class="resource resource--green" data-value="0" aria-label="Зелёная энергия: 0">
            <svg class="resource-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13 2 4 14h7l-1 8 10-13h-7z" />
            </svg>
            <output class="resource-value">0</output>
          </div>
          <div class="resource resource--red" data-value="0" aria-label="Красная энергия: 0">
            <svg class="resource-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13 2 4 14h7l-1 8 10-13h-7z" />
            </svg>
            <output class="resource-value">0</output>
          </div>
          <div class="resource resource--yellow" data-value="1000" data-max="1000" aria-label="Жёлтая энергия: 1000 из 1000">
            <svg class="resource-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13 2 4 14h7l-1 8 10-13h-7z" />
            </svg>
            <output class="resource-value">1к/1к</output>
          </div>
        </div>
        <div class="resource-group resource-group--economy">
          <div class="resource resource--atom" data-value="0" aria-label="Атомы: 0">
            <svg class="resource-icon resource-icon--atom" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="2.2" />
              <ellipse cx="12" cy="12" rx="9" ry="3.8" />
              <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(60 12 12)" />
              <ellipse cx="12" cy="12" rx="9" ry="3.8" transform="rotate(120 12 12)" />
            </svg>
            <output class="resource-value">0</output>
          </div>
          <div class="resource resource--money-green" data-value="1000" aria-label="Зелёные деньги: 1000">
            <span class="resource-icon resource-icon--dollar" aria-hidden="true">$</span>
            <output class="resource-value">1.0к</output>
          </div>
          <div class="resource resource--money-yellow" data-value="0" aria-label="Жёлтые деньги: 0">
            <span class="resource-icon resource-icon--dollar" aria-hidden="true">$</span>
            <output class="resource-value">0</output>
          </div>
        </div>
      </header>

      <section class="map" aria-label="Карта фабрики">
        <div class="world" aria-hidden="true"></div>
      </section>
      <footer class="bottom-panel" aria-label="Нижняя панель">
        <div class="action-bar">
          <button class="action-button" id="shopButton" type="button" aria-label="Открыть магазин" aria-expanded="false" aria-controls="shopPopover">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14.5 4.5 5 5-3.2 3.2-5-5z" />
              <path d="m13.5 10.5-8 8" />
            </svg>
          </button>
          <button class="action-button" id="moveButton" type="button" aria-label="Режим передвижения" aria-pressed="false">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v18M3 12h18" />
              <path d="m8 7 4-4 4 4M8 17l4 4 4-4M7 8l-4 4 4 4M17 8l4 4-4 4" />
            </svg>
          </button>
          <button class="action-button" id="rotateButton" type="button" aria-label="Режим поворота" aria-pressed="false">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0 1 4" />
              <path d="M20 4v7h-7" />
            </svg>
          </button>
          <button class="action-button action-button--danger" id="cancelButton" type="button" aria-label="Отмена">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
      </footer>
      <aside class="shop-popover" id="shopPopover" aria-label="Магазин">
        <div class="shop-grid"></div>
      </aside>
      <section class="placement-menu" id="placementMenu" aria-label="Подтверждение размещения">
        <strong class="placement-name"></strong>
        <button class="placement-button placement-button--confirm" id="confirmPlacement" type="button" aria-label="Подтвердить размещение">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
        </button>
        <button class="placement-button placement-button--cancel" id="discardPlacement" type="button" aria-label="Отменить размещение">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </section>
      <section class="machine-menu" id="machineMenu" aria-label="Меню бура">
        <strong>Бур</strong>
        <span class="machine-level">Уровень 1</span>
        <span class="machine-rate"></span>
        <div class="machine-drop-list"></div>
        <button class="machine-upgrade" id="machineUpgrade" type="button">Улучшить · 10 $</button>
      </section>
      <div class="build-preview" id="buildPreview" aria-hidden="true"></div>
    </main>

    <script src="factory.js"></script>
  </body>
</html>
